services:
  postgres:
    image: postgres:16-alpine
    container_name: talie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talie_dev
      POSTGRES_USER: talie
      POSTGRES_PASSWORD: talie_dev_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talie -d talie_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - talie_postgres_data:/var/lib/postgresql/data

volumes:
  talie_postgres_data:
